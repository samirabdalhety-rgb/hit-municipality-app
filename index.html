<style>
:root{--bg:#eaf1ef;--card:#fff;--ink:#16302d;--mut:#5d7471;--pri:#0f4c47;--pri2:#1b6b63;--gold:#c58f2c;--line:#cfdcd9;--red:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a19;--card:#172826;--ink:#e6f0ee;--mut:#9bb3af;--pri:#2a8f84;--pri2:#3aa89b;--line:#2c4542}}
:root[data-theme="dark"]{--bg:#0e1a19;--card:#172826;--ink:#e6f0ee;--mut:#9bb3af;--pri:#2a8f84;--pri2:#3aa89b;--line:#2c4542}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,"Segoe UI",sans-serif;line-height:1.6}
.hero{background:linear-gradient(135deg,#0f4c47,#1b6b63);color:#fff;text-align:center;padding:28px 16px 54px;
border-bottom:4px solid var(--gold);border-radius:0 0 50% 50%/0 0 28px 28px}
.hero h1{margin:0;font-size:clamp(22px,5vw,34px);font-weight:800}.hero p{margin:4px 0 0;font-size:clamp(15px,3.5vw,20px);color:#f1d9a3;font-weight:600}
.wrap{max-width:980px;margin:-30px auto 24px;padding:0 14px;position:relative;z-index:2}
.hs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.hs div{background:var(--card);border:1.5px solid var(--gold);border-radius:14px;padding:8px 6px;text-align:center;font-size:13px;line-height:1.3}.hs b{display:block;font-size:26px;color:var(--pri2)}
.lgbox{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;align-items:end}@media(max-width:560px){.lgbox{grid-template-columns:1fr}}
.alert{background:var(--card);border:1px solid var(--gold);border-radius:12px;padding:8px 14px;margin-bottom:14px;font-size:14px;text-align:center}
.grid{background:var(--card);border-radius:28px;border:2px solid var(--line);padding:22px 14px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.tile{border:2px solid var(--pri2);background:var(--bg);color:var(--ink);border-radius:50px;min-height:92px;font:600 16px Cairo,Tahoma,sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px;transition:.15s}
.tile:hover,.tile:focus-visible{background:var(--pri);color:#fff;transform:translateY(-2px);outline:3px solid var(--gold)}
.tile svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8}
.tile.top{grid-column:2}
@media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr)}.tile.top{grid-column:1/-1}}
.bar{display:flex;align-items:center;gap:10px;background:var(--pri);color:#fff;padding:10px 16px;position:sticky;top:0;z-index:5}
.bar h2{margin:0;font-size:18px;flex:1}
button,.btn{font-family:inherit;cursor:pointer}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:9px 18px;font-weight:600;font-size:15px}
.btn.alt{background:var(--card);color:var(--pri);border:1.5px solid var(--pri)}.btn.gold{background:var(--gold);color:#241a05}.btn.red{background:var(--red)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold)}
.page{max-width:1100px;margin:0 auto;padding:14px}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:820px){.cols{grid-template-columns:1fr}}
fieldset{border:1.5px solid var(--line);border-radius:14px;background:var(--card);padding:10px 14px 14px;margin:0}
legend{font-weight:800;color:var(--pri2);padding:0 8px}
label{display:block;font-size:13px;color:var(--mut);margin-top:8px;font-weight:600}
input,select,textarea{width:100%;padding:8px 10px;border:1.5px solid var(--fbd,var(--line));border-radius:8px;background:var(--fld,var(--bg));color:var(--ink);font:15px Cairo,Tahoma,sans-serif}
input[readonly]{background:var(--line);font-weight:700}
.note{color:var(--red);font-size:13px;margin:12px 2px;font-weight:600}
.act{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.tw{overflow-x:auto;background:var(--card);border-radius:12px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:14px}
th{background:var(--pri);color:#fff;padding:8px;white-space:nowrap}td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:center}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:12px}.tools>div{min-width:150px}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}.stat b{display:block;font-size:30px;color:var(--pri2)}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;display:none;z-index:9}
.tw td input{min-width:84px;padding:4px}
body *,.btn,.tile{font-size:inherit}
</style>
</head>
<body>

  ['المهندس سنان سعدي مجيد            مدير بلدية هيت            /   /'+yr,'قسمة محمد عبدالله            مسؤولة الشعبة المالية        /    /'+yr,'خالد وليد عبدالجبار        مسؤول شعبة الموارد البشرية       /    /'+yr,'فرقد مقبل قهير        مسؤول شعبة التدقيق        /     /'+yr,'حسان عبدالخالق حنوش        مسؤول الشعبة القانونية      /     /'+yr].forEach(tx=>{const r=ws.addRow([tx]);ws.mergeCells(r.number,1,r.number,n);xs(r.getCell(1),'Arial',11,null,'right',false)});
 }else{

  for(let r=1;r<=2;r++){for(let k=1;k<=16;k++)xs(ws.getCell(r,k),'Arial',24,'FFCC99FF');ws.getRow(r).height=100.8}
  const hr=ws.addRow(['ت','اسم الوزارة','اسم البلدية','الاسم الثلاثي','العنوان الوظيفي','الدرجة الحالية','المرحلة الحالية','الشهادة','تاريخ استحقاق الترفيع السابق','امر اخر ترفيع','اوامر الشكر','العقوبات او إضافة خدمة','العنوان الوظيفي الجديد','الدرجة الجديده','المرحلة الجديده','تاريخ الاستحقاق الجديد']);
  hr.height=100.8;hr.eachCell(c=>xs(c,'Times New Roman',18,'FFFFFFFF'));
  rows.forEach(({e,c},i)=>{const v=[i+1,'محافظة الانبار','مديرية بلدية هيت',e.name,e.title,+e.g,+e.s,e.eduX||e.edu,UD(pd(e.lastP)),e.promoOrder||'/',ltxt(perL(e))||'/',num(e.pen)?num(e.pen)+' شهر':'/',e.title,c.ng,c.ns,UD(c.due)];const r=ws.addRow(v);
   r.eachCell(x=>xs(x,'Times New Roman',20,'FFC0C0C0'));[9,16].forEach(k=>r.getCell(k).numFmt='d/m/yyyy;@');
   r.height=Math.max(100.8,27*Math.max(...v.map((x,k)=>typeof x=='string'?Math.ceil(x.length/(W[k]*.5)):1)))});

async function expNames(){
 if(!dl){toast('التصدير غير متاح في هذا العرض');return}
 if(typeof ExcelJS=='undefined'){toast('تعذّر تحميل مكتبة التصدير');return}
 if(!S.emps.length){toast('لا يوجد موظفون للتصدير');return}
 const wb=new ExcelJS.Workbook(),ws=wb.addWorksheet('الأسماء',{views:[{rightToLeft:true}]});ws.columns=[{width:50}];
 const h=ws.addRow(['اسم الموظف']);xs(h.getCell(1),'Arial',12,'FFDDD9C3');h.height=28;
 S.emps.forEach(e=>{const r=ws.addRow([e.name]);xs(r.getCell(1),'Arial',12,null);r.height=24});
 const buf=await wb.xlsx.writeBuffer();
 try{await dl.save({filename:'اسماء_الموظفين.xlsx',data:buf})}catch(err){if(err.code!='declined')toast('تعذّر الحفظ: '+(err.message||err.code))}
}
applyUI();
const cstat=t=>{const x=$('#cstat');if(x)x.textContent=t};
function cloudSave(){
 if(!fdb||!fuser)return;clearTimeout(ctimer);
 ctimer=setTimeout(async()=>{try{cstat('جارٍ الحفظ في السحابة...');
  await fdb.collection('hit_unit').doc('main').set({json:JSON.stringify({emps:S.emps,set:S.set}),by:fuser.email||'anonymous',at:firebase.firestore.FieldValue.serverTimestamp()});
  cstat('تم الحفظ في السحابة ✓')}catch(e){cstat('تعذّر الحفظ في السحابة');toast('تعذّر الحفظ في Firebase: '+(e.code||e.message))}},600);
}
async function cloudLoad(){
 const d=await fdb.collection('hit_unit').doc('main').get();
 if(d.exists){const c=JSON.parse(d.data().json);S.emps=c.emps||[];S.set=c.set||S.set;migrate();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}cstat('متصل بالسحابة ✓')}
 else if(S.emps.length){cstat('رفع البيانات المحلية إلى السحابة...');cloudSave()}
 else cstat('متصل بالسحابة - لا توجد بيانات بعد');
 applyUI();home();
}
function fbInit(){
 if(!FB_ON){if(gateOK())$('#login').style.display='none';cstat('وضع محلي: Firebase غير مُعدّ (البيانات على هذا الجهاز فقط)');return}
 firebase.initializeApp(FB_CONFIG);fdb=firebase.firestore();
 firebase.auth().onAuthStateChanged(u=>{fuser=u;$('#outb').style.display=gateOK()?'':'none';
  if(u){if(gateOK())$('#login').style.display='none';cloudLoad().catch(e=>{cstat('تعذّر التحميل من السحابة');toast('تعذّر التحميل: '+(e.code||e.message))})}
  else firebase.auth().signInAnonymously().catch(e=>{cstat('تعذّر الاتصال بالسحابة');toast('تعذّر الدخول: '+(e.code||e.message))})});
}
const GU='سامر',GH='33ce62d441d82235a2e4640a3248a3ef5eb45edd095d27fbf880ee97e98d9c38';
const gateOK=()=>sessionStorage.getItem('hit-ok')=='1';
async function doLogin(){const u=$('#lg_em').value.replace(/\s/g,''),p=$('#lg_pw').value.trim().replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
 const h=[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(p)))].map(b=>b.toString(16).padStart(2,'0')).join('');
 if(u==GU&&h==GH){sessionStorage.setItem('hit-ok','1');$('#lg_err').textContent='';$('#login').style.display='none';$('#outb').style.display='';$('#lg_pw').value=''}
 else $('#lg_err').textContent='اسم المستخدم أو رمز الدخول غير صحيح'}
function doLogout(){sessionStorage.removeItem('hit-ok');location.reload()}
dl={save:async({filename,data})=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}};
fbInit();
home();
