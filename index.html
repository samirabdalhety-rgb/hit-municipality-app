<style>
:root{--bg:#eaf1ef;--card:#fff;--ink:#16302d;--mut:#5d7471;--pri:#0f4c47;--pri2:#1b6b63;--gold:#c58f2c;--line:#cfdcd9;--red:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a19;--card:#172826;--ink:#e6f0ee;--mut:#9bb3af;--pri:#2a8f84;--pri2:#3aa89b;--line:#2c4542}}
:root[data-theme="dark"]{--bg:#0e1a19;--card:#172826;--ink:#e6f0ee;--mut:#9bb3af;--pri:#2a8f84;--pri2:#3aa89b;--line:#2c4542}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,"Segoe UI",sans-serif;line-height:1.6}
.hero{background:linear-gradient(135deg,#0f4c47,#1b6b63);color:#fff;text-align:center;padding:28px 16px 54px;
border-bottom:4px solid var(--gold);border-radius:0 0 50% 50%/0 0 28px 28px}
.hero h1{margin:0;font-size:clamp(24px,6vw,42px);font-weight:800;line-height:1.4}.hero p{margin:4px 0 0;font-size:clamp(15px,3.5vw,20px);color:#f1d9a3;font-weight:600}
.wrap{max-width:980px;margin:-30px auto 24px;padding:0 14px;position:relative;z-index:2}
.hs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.hs div{background:var(--card);border:1.5px solid var(--gold);border-radius:14px;padding:8px 6px;text-align:center;font-size:13px;line-height:1.3}.hs b{display:block;font-size:26px;color:var(--pri2)}
.lgbox{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;align-items:end}@media(max-width:560px){.lgbox{grid-template-columns:1fr}}
.alert{background:var(--card);border:1px solid var(--gold);border-radius:12px;padding:8px 14px;margin-bottom:14px;font-size:14px;text-align:center}
.grid{background:var(--card);border-radius:28px;border:2px solid var(--line);padding:22px 14px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.tile{border:2px solid var(--pri2);background:var(--bg);color:var(--ink);border-radius:50px;min-height:92px;font:600 16px Cairo,Tahoma,sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px;transition:.15s}
.tile:hover,.tile:focus-visible{background:var(--pri);color:#fff;transform:translateY(-2px);outline:3px solid var(--gold)}
.tile svg{width:var(--is,26px);height:var(--is,26px);stroke:var(--ic,currentColor);fill:none;stroke-width:1.8}
.tile.top{grid-column:2}.tile.last{grid-column:2}
@media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr)}.tile.top{grid-column:1/-1}.tile.last{grid-column:1/-1}}
.bar{display:flex;align-items:center;gap:10px;background:var(--pri);color:#fff;padding:10px 16px;position:sticky;top:0;z-index:5}
.bar h2{margin:0;font-size:18px;flex:1}
button,.btn{font-family:inherit;cursor:pointer}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:9px 18px;font-weight:600;font-size:15px}
.btn.alt{background:var(--card);color:var(--pri);border:1.5px solid var(--pri)}.btn.gold{background:var(--gold);color:#241a05}.btn.red{background:var(--red)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold)}
.page{max-width:1100px;margin:0 auto;padding:14px}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:820px){.cols{grid-template-columns:1fr}}
fieldset{border:1.5px solid var(--line);border-radius:14px;background:var(--card);padding:10px 14px 14px;margin:0}
legend{font-weight:800;color:var(--pri2);padding:0 8px}
label{display:block;font-size:13px;color:var(--mut);margin-top:8px;font-weight:600}
input,select,textarea{width:100%;padding:8px 10px;border:1.5px solid var(--fbd,var(--line));border-radius:8px;background:var(--fld,var(--bg));color:var(--ink);font:15px Cairo,Tahoma,sans-serif}
input[readonly]{background:var(--line);font-weight:700}
.note{color:var(--red);font-size:13px;margin:12px 2px;font-weight:600}
.act{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.tw{overflow-x:auto;background:var(--card);border-radius:12px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:14px}
th{background:var(--pri);color:#fff;padding:8px;white-space:nowrap}td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:center}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:12px}.tools>div{min-width:150px}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}.stat b{display:block;font-size:30px;color:var(--pri2)}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;display:none;z-index:9}
.tw td input{min-width:84px;padding:4px}
body *,.btn,.tile{font-size:inherit}
.gearb{position:absolute;top:10px;inset-inline-end:10px;width:38px;height:38px;border-radius:50%;border:1.5px solid rgba(255,255,255,.65);background:rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;z-index:3}
.gearb:hover,.gearb:focus-visible{background:rgba(255,255,255,.28);outline:3px solid var(--gold)}
.gearb svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.badge{display:inline-block;background:var(--gold);color:#241a05;border-radius:8px;padding:0 8px;font-size:12px;font-weight:800;margin-inline-start:6px;vertical-align:middle}
tr.stl td{background:rgba(197,143,44,.20)}
.lvcard{background:var(--card);border:2px solid var(--gold);border-radius:16px;padding:12px 14px;margin:12px 0}.lvcard h3{margin:0;color:var(--pri2)}.lvcard p{margin:2px 0 0;color:var(--mut);font-weight:600}
.lvres{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.cols2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;align-items:start}@media(max-width:820px){.cols2{grid-template-columns:1fr}}
.lvt{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;max-width:560px;margin:8px auto}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:8;display:flex;align-items:center;justify-content:center;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}
.mdl{background:var(--bg);border:2px solid var(--gold);border-radius:16px;width:min(640px,100%);max-height:86vh;display:flex;flex-direction:column;overflow:hidden}
.mh{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--pri);color:#fff;padding:8px 14px}.mh h3{margin:0;font-size:17px}.mh .btn{padding:4px 12px}
.mb{padding:12px 14px;overflow:auto}.mb .cols2{grid-template-columns:1fr}
textarea.sm{resize:vertical;min-height:0}
.ar{display:grid;grid-template-columns:290px 1fr;gap:14px;align-items:start}
@media(max-width:800px){.ar{grid-template-columns:1fr}}
.arl{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;max-height:78vh;overflow:auto;position:sticky;top:64px}
@media(max-width:800px){.arl{position:static;max-height:260px}}
.are{display:flex;justify-content:space-between;gap:6px;align-items:center;width:100%;text-align:start;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 6px;color:var(--ink);font-family:inherit;font-weight:600;font-size:.92em;line-height:1.3;border-radius:8px;cursor:pointer}
.are:hover{background:var(--bg)}.are.on{background:var(--pri);color:#fff}
.are small{opacity:.8;font-weight:600;white-space:nowrap;font-size:.85em}
.arg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.arc{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.arc .th{height:170px;display:flex;align-items:center;justify-content:center;background:var(--bg);cursor:pointer;position:relative;color:var(--mut);font-weight:700}
.arc .th img{max-width:100%;max-height:100%;object-fit:contain}
.arc .mt{padding:6px 8px;font-size:.85em;line-height:1.4;word-break:break-word}
.arc .bt{display:flex;gap:4px;padding:0 6px 6px}.arc .bt .btn{padding:3px 8px;font-size:.85em;flex:1}
.arpg{position:absolute;top:6px;right:6px;background:var(--pri);color:#fff;border-radius:8px;padding:1px 8px;font-size:.8em}
#ar_f1,#ar_f2,#ar_fc{min-width:130px}.drop{border:2px dashed var(--pri2);border-radius:14px;padding:10px;text-align:center;color:var(--mut);margin:10px 0;font-weight:600}
.drop.on{background:var(--bg);border-color:var(--gold)}
.arok{background:var(--card);border:1.5px solid var(--pri2);border-radius:12px;padding:8px 12px;margin:8px 0;font-weight:600}
#arv{position:fixed;inset:0;z-index:20;background:#050d0c;display:flex;flex-direction:column}
.arvb{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px calc(8px + env(safe-area-inset-right,0px)) 8px 8px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:#0b1c1a}
.arvb .btn{padding:5px 12px;font-size:.9em}
.arvs{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;touch-action:none}
.arvs img{max-width:100%;max-height:100%;transform-origin:center;user-select:none;-webkit-user-drag:none;cursor:grab}
.arvn{position:absolute;top:50%;transform:translateY(-50%);background:rgba(15,76,71,.85);color:#fff;border:0;border-radius:50%;width:46px;height:46px;font-size:22px;cursor:pointer;z-index:2}
.arvi{padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px));color:#dfeae8;font-size:.9em;max-height:22vh;overflow:auto;background:#0b1c1a;line-height:1.6}
.dt{display:flex;gap:6px;width:100%}.dt select{flex:1;min-width:0;padding-inline:4px}
</style>

 if(sec)mtSec=sec;sec=mtSec;
 shell(MSEC[sec]+' — ادامة الموظفين',`<div class="tools"><div><label>بحث بالاسم أو الرقم الوظيفي<input id="mq" type="search" autocomplete="off"></label></div><div style="max-width:110px"><label>عدد الموظفين<input id="mcnt" readonly style="text-align:center;font-weight:700"></label></div>${sec=='perm'?'<button class="btn gold" onclick="mtForm()">إضافة موظف</button>':''}<button class="btn" onclick="mtExport()">تصدير Excel</button><button class="btn alt" onclick="mtHub()">الأقسام</button></div>
 <div class="tw"><table><thead><tr><th>ت</th><th>الرقم الوظيفي</th><th>الاسم</th><th>العنوان الوظيفي</th><th>الجنس</th><th>الدرجة/المرحلة</th><th>الراتب الاسمي</th><th>آخر علاوة</th><th>آخر ترفيع</th><th>رقم الهاتف</th><th>الحالة</th><th></th></tr></thead><tbody id="mtb"></tbody></table></div>`);
 const draw=()=>{const q=nrmA($('#mq').value.trim()),L=S.emps.filter(e=>mtSecOf(e)==sec&&(!q||nrmA(e.name+' '+((e.m||{}).empNo||'')).includes(q)));
  $('#mcnt').value=L.length;
  $('#mtb').innerHTML=L.map((e,i)=>`<tr${mtSt(e)=='sec'?' style="background:#fff200;color:#000"':''}><td>${i+1}</td><td>${lvEs((e.m||{}).empNo)}</td><td>${lvEs(e.name)}</td><td>${lvEs(e.title)}</td><td>${lvEs((e.m||{}).gender)}</td><td>${e.g||''}/${e.s||''}</td><td>${nf(salary(num(e.g),num(e.s)))}</td><td>${fd(pd(e.lastA))}</td><td>${fd(pd(e.lastP))}</td><td>${lvEs((e.m||{}).phone)}</td><td>${MST[mtSt(e)]}</td><td style="white-space:nowrap"><button class="btn alt" onclick="mtForm(${e.id})">تعديل</button> ${mtQb(e)}</td></tr>`).join('')||'<tr><td colspan="12">لا توجد بيانات في هذا القسم.</td></tr>'};
 $('#mq').oninput=draw;draw();
}
function mtForm(id){
 const e=id?S.emps.find(x=>x.id==id):{g:5,s:1};if(!e)return;
 const fld=f=>{const k=f[0],l=f[1],t=f[3],v=mtGet(e,f),i='m_'+k;
  if(t=='g')return `<label>${l}<select id="${i}">${rng(10,v)}</select></label>`;
  if(t=='s')return `<label>${l}<select id="${i}">${rng(11,v)}</select></label>`;
  if(t=='gender')return `<label>${l}<select id="${i}"><option value="">— اختر —</option>${['ذكر','أنثى'].map(o=>`<option${v==o?' selected':''}>${o}</option>`).join('')}</select></label>`;
  if(t=='marital')return `<label>${l}<select id="${i}"><option value="">— اختر —</option>${['أعزب','متزوج'].map(o=>`<option${v==o?' selected':''}>${o}</option>`).join('')}</select></label>`;
  if(t=='sal')return `<label>${l}<input id="${i}" readonly value="${nf(v)}"></label>`;
  return `<label>${l}<input id="${i}" type="${t=='date'?'date':t=='tel'?'tel':'text'}" value="${lvEs(v)}"></label>`};
 const nf_=MF.find(f=>f[3]=='area');
 shell(id?'تعديل بيانات موظف':'إضافة موظف',`<fieldset><legend>الحالة الوظيفية</legend><label>الموظف<select id="m_status">${Object.keys(MST).map(k=>`<option value="${k}"${mtSt(e)==k?' selected':''}>${MST[k]}</option>`).join('')}</select></label><p class="note">منسب: يُظلَّل باللون الأصفر عند تصدير Excel. تقاعد أو نقل: تُنقل بيانات الموظف إلى قسم التقاعد أو النقل ويُستثنى من قوائم العلاوات والترفيع والإحصاءات.</p></fieldset>
 <fieldset style="margin-top:14px"><legend>المعلومات العامة</legend><div class="cols">${MF.filter(f=>f[3]!='area').map(fld).join('')}</div></fieldset>
 <fieldset style="margin-top:14px"><legend>ملاحظات</legend><label>${nf_[1]}<textarea id="m_${nf_[0]}" rows="3">${lvEs(mtGet(e,nf_))}</textarea></label></fieldset>
 <p class="note">الحقول: الاسم، الدرجة، المرحلة، الراتب الاسمي، تاريخ آخر علاوة، تاريخ آخر ترفيع، تاريخ التعيين — مرتبطة بسجل العلاوات والترفيعات، فأي تغيير في أحدهما (ومنه إضافة علاوة أو ترفيع جديد) ينعكس على الآخر تلقائياً.</p>
 <div class="act"><button class="btn gold" onclick="mtSave(${id??'null'})">${id?'حفظ التعديل':'إضافة'}</button><button class="btn alt" onclick="mtPage()">إلغاء</button></div>`);
 const sy=()=>{$('#m_sal').value=nf(salary(num($('#m_g').value),num($('#m_s').value)))};
 ['m_g','m_s'].forEach(i=>$('#'+i).addEventListener('input',sy));sy();
}
function mtSave(id){
 const g=k=>$('#m_'+k).value,name=g('name').trim();
 if(!name){toast('اسم الموظف مطلوب');return}
 const no=g('empNo').trim();
 if(no&&S.emps.some(x=>x.id!=id&&String((x.m||{}).empNo||'').trim()==no)){toast('الرقم الوظيفي مستخدم لموظف آخر');return}
 let e=id?S.emps.find(x=>x.id==id):null;
 if(!e){e={id:Date.now(),edu:'بكالوريوس',letters:[]};S.emps.push(e)}
 e.name=name;{const tt=g('title').trim();e.title=tt;const Lg=S.set.tg[num(e.g)-1];if(tt&&Lg&&!Lg.includes(tt))Lg.push(tt)}e.g=g('g');e.s=g('s');e.lastA=g('lastA');e.lastP=g('lastP');e.hireDate=g('hireDate');
 e.m=e.m||{};MF.filter(f=>f[2]=='m').forEach(f=>{e.m[f[0]]=g(f[0]).trim()});
 const ns=g('status'),mv=ns=='ret'||ns=='trf';e.m.status=ns;
 save();toast(mv?'تم نقل الموظف إلى قسم '+MSEC[ns]:id?'تم حفظ التعديل':'تمت الإضافة');mtPage();
}
async function mtExport(){
 if(!dl){toast('التصدير غير متاح في هذا العرض');return}
 if(typeof ExcelJS=='undefined'){toast('تعذّر تحميل مكتبة التصدير');return}
 const sec=mtSec,EL=S.emps.filter(e=>mtSecOf(e)==sec);
 if(!EL.length){toast('لا يوجد موظفون للتصدير في هذا القسم');return}
 const wb=new ExcelJS.Workbook(),ws=wb.addWorksheet(MSEC[sec],{views:[{rightToLeft:true,state:'frozen',ySplit:1}]});
 const wide={name:34,grad:28,gradOk:24,notes:40};
 ws.columns=[{width:6},...MF.map(f=>({width:wide[f[0]]||18})),{width:16}];
 const h=ws.addRow(['ت',...MF.map(f=>f[1]),'الحالة الوظيفية']);h.height=42;h.eachCell(c=>xs(c,'Arial',11,'FFDDD9C3'));
 EL.forEach((e,i)=>{
  const v=MF.map(f=>{const x=mtGet(e,f);if(f[3]=='date')return x?UD(pd(x)):'';if(f[3]=='g'||f[3]=='s'||f[3]=='sal')return x===''?'':+x;return String(x)});
  const r=ws.addRow([i+1,...v,MST[mtSt(e)]]);r.height=26;r.eachCell(c=>xs(c,'Arial',11,mtSt(e)=='sec'?'FFFFFF00':null));
  MF.forEach((f,k)=>{if(f[3]=='date')r.getCell(k+2).numFmt='yyyy/mm/dd';if(f[3]=='sal')r.getCell(k+2).numFmt='#,##0'});
 });
 const buf=await wb.xlsx.writeBuffer();
 try{await dl.save({filename:'ادامة_'+MSEC[sec].replace(/ /g,'_')+'.xlsx',data:buf})}catch(err){if(err.code!='declined')toast('تعذّر الحفظ: '+(err.message||err.code))}
}

applyUI();
const cstat=t=>{const x=$('#cstat');if(x)x.textContent=t};
function cloudSave(){
 if(!fdb||!fuser)return;clearTimeout(ctimer);
 ctimer=setTimeout(async()=>{try{cstat('جارٍ الحفظ في السحابة...');
  await fdb.collection('hit_unit').doc('main').set({json:JSON.stringify({emps:S.emps,set:S.set}),by:fuser.email||'anonymous',at:firebase.firestore.FieldValue.serverTimestamp()});
  cstat('تم الحفظ في السحابة ✓')}catch(e){cstat('تعذّر الحفظ في السحابة');toast('تعذّر الحفظ في Firebase: '+(e.code||e.message))}},600);
}
async function cloudLoad(){
 const d=await fdb.collection('hit_unit').doc('main').get();
 if(d.exists){
  let c=null;
  try{c=JSON.parse(d.data().json);if(!c||!Array.isArray(c.emps))throw new Error('bad')}catch(err){
   /* بيانات السحابة تالفة: نُبقي البيانات المحلية ولا نكتب فوق السحابة */
   cstat('بيانات السحابة تالفة — تم الاحتفاظ ببيانات هذا الجهاز');toast('تعذّر قراءة بيانات السحابة (تالفة). لم يتم تغيير أي شيء.');applyUI();home();return}
  try{S.emps=c.emps;S.set=c.set||S.set;migrate();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('تعذّر الحفظ المحلي: الذاكرة ممتلئة أو التصفح خاص')}cstat('متصل بالسحابة ✓')}catch(err){cstat('تعذّر تطبيق بيانات السحابة');toast('خطأ أثناء تحميل البيانات: '+(err.message||err));applyUI();home();return}}
 else if(S.emps.length){cstat('رفع البيانات المحلية إلى السحابة...');cloudSave()}
 else cstat('متصل بالسحابة - لا توجد بيانات بعد');
 applyUI();home();
}
function fbInit(){
 if(!FB_ON){if(gateOK())$('#login').style.display='none';cstat('وضع محلي: Firebase غير مُعدّ (البيانات على هذا الجهاز فقط)');return}
 firebase.initializeApp(FB_CONFIG);fdb=firebase.firestore();
 firebase.auth().onAuthStateChanged(u=>{fuser=u;$('#outb').style.display=gateOK()?'':'none';
  if(u){if(gateOK())$('#login').style.display='none';cloudLoad().catch(e=>{cstat('تعذّر التحميل من السحابة');toast('تعذّر التحميل: '+(e.code||e.message))})}
  else firebase.auth().signInAnonymously().catch(e=>{cstat('تعذّر الاتصال بالسحابة');toast('تعذّر الدخول: '+(e.code||e.message))})});
}
const GU='سامر',GH='33ce62d441d82235a2e4640a3248a3ef5eb45edd095d27fbf880ee97e98d9c38';
const gateOK=()=>sessionStorage.getItem('hit-ok')=='1';
async function doLogin(){const u=$('#lg_em').value.replace(/\s/g,''),p=$('#lg_pw').value.trim().replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
 const h=[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(p)))].map(b=>b.toString(16).padStart(2,'0')).join('');
 if(u==GU&&h==GH){sessionStorage.setItem('hit-ok','1');$('#lg_err').textContent='';$('#login').style.display='none';$('#outb').style.display='';$('#lg_pw').value=''}
 else $('#lg_err').textContent='اسم المستخدم أو رمز الدخول غير صحيح'}
function doLogout(){sessionStorage.removeItem('hit-ok');location.reload()}
dl={save:async({filename,data})=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}};
fbInit();
home();
</script>
<script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
